<rect x="124" y="125" width="11" height="11" fill="#a4453f"/>
<text x="141" y="134" font-size="11" fill="#5b6270">identity top-1（整体准确率）</text>
<rect x="124" y="141" width="11" height="11" fill="#2f5d8c"/>
<text x="141" y="150" font-size="11" fill="#5b6270">diff-state separated（状态分离度）</text>
<text x="110" y="412" font-size="12" font-weight="600" fill="#16181d">① 先验作为分离器有效，崩的是喂给它的身份估计</text>
<text x="124" y="430" font-size="11" fill="#5b6270">预测前驱的状态分离度 0.972 是四种模式里最高的，而整体准确率掉回 0.727（visual 0.730）</text>
<text x="110" y="454" font-size="12" font-weight="600" fill="#16181d">② 把先验做成硬约束，是身份误差转成预测误差的那一步</text>
<text x="124" y="472" font-size="11" fill="#5b6270">prior_override 从 oracle 的 1 跳到预测前驱的 18 —— 一旦前驱靠估计，它推翻视觉 18 次而多半推翻错</text>
<text x="40" y="508" font-size="10" fill="#8a8f9a">数据 interaction_graph_expD_online.json。oracle 前驱 +0.056、预测前驱 -0.003、全自维护 -0.118（相对 visual）。</text>
