  <g id="text_24">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #526777" transform="translate(40.32 505.621969)">Intervals are stored E2 contrasts. A non-significant semantic-label contrast is not a gain from random labels.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #526777" transform="translate(40.32 515.7)">The long-context contrast changes more than token count; it is not a pure causal length estimate.</text>
