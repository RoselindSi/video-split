<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第二位标注者：动作关系离线标注</title>
<style>
:root{color-scheme:dark;--bg:#151717;--panel:#202322;--line:#4a504e;--ink:#f2f4f3;--muted:#bdc7c3;--accent:#7acdb3;--warn:#e5b76a;--ok:#87d7a9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,sans-serif;letter-spacing:0}button,select,input{font:inherit}button,select,input[type=text],input[type=number]{color:var(--ink);background:#292e2c;border:1px solid #68716e;border-radius:4px;padding:10px}button{cursor:pointer;min-height:46px}button:hover{background:#38413d}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button:disabled{opacity:.45;cursor:default}header{position:sticky;top:0;z-index:4;background:#171a19;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header b{font-size:18px}.progress{margin-left:auto;color:var(--muted)}main{max-width:1380px;margin:auto;padding:18px}.notice{border-left:4px solid var(--warn);padding:9px 14px;background:#24241f;margin-bottom:16px}.notice strong{display:block}.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(390px,1fr);gap:24px}.viewer{min-width:0;position:sticky;top:82px;align-self:start}video{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#000;max-height:66vh}.tools,.nav,.actions,.export{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding-top:10px}.clock{font-family:ui-monospace,monospace;color:var(--muted)}.step{border:0;border-top:1px solid var(--line);padding:16px 0;margin:0}.step legend{font-size:18px;font-weight:750;padding:0 0 8px}.required:after{content:' · 必填';color:#ffb5a8;font-size:12px;font-weight:500}.relations{display:grid;gap:8px}.relation{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:4px;cursor:pointer}.relation:has(input:checked){background:#25473b;border-color:var(--accent)}.relation input{margin-top:6px;flex:none}.relation b,.relation small{display:block}.relation small{color:var(--muted)}.fields{display:grid;gap:12px}.field{display:grid;gap:5px}.field label{font-weight:650}.hint{font-size:14px;color:var(--muted);margin:0}.hidden{display:none!important}.time{display:grid;grid-template-columns:1fr auto 1fr auto;gap:6px}.evidence{display:grid;gap:10px}.evidence label{display:grid;gap:5px;font-weight:650}.preview{border-left:3px solid var(--accent);padding:10px;background:#202624;color:var(--muted)}details{margin-top:10px;color:var(--muted)}summary{cursor:pointer}.actions{border-top:1px solid var(--line);padding-top:14px}.actions #submit{margin-left:auto;background:#28634b}.nav{justify-content:space-between;margin-top:16px;border-top:1px solid var(--line)}#alert{min-height:28px;color:#ffb2a7;padding-top:5px}.case-panel{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}.case-list{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.case-list button{min-width:0;padding:7px;font-size:14px}.case-list button.final{background:#28533f;border-color:#78b995}.case-list button.draft{background:#5a4929;border-color:#b99859}.case-list button.current{outline:3px solid var(--accent)}.export{margin-top:18px;padding:16px;background:var(--panel);border:1px solid var(--line)}.export strong{width:100%}.export-note{color:var(--muted);font-size:14px}.ok{color:var(--ok)}
.video-error{border-left:4px solid #ffb5a8;background:#342724;padding:12px;margin-top:10px}.video-error p{margin:0 0 10px}.video-error button{margin-right:8px}.video-ok{color:var(--ok);font-size:14px;min-height:22px;margin:7px 0 0}
@media(max-width:900px){.layout{grid-template-columns:1fr}.viewer{position:static}video{max-height:52vh}.case-list{grid-template-columns:repeat(6,1fr)}}
@media(max-width:520px){main{padding:12px}header{padding:10px 12px}.time{grid-template-columns:1fr auto}.actions #submit{width:100%;margin-left:0}.case-list{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<header><b>第二位标注者：离线标注</b><span id="caseTitle"></span><span class="progress" id="progress"></span></header>
<main>
<div class="notice"><strong>本批统一规则</strong>标记点在空白处，但后面清楚出现不同的新动作，就选“换了另一种事”；边界秒数填新动作真正开始的时刻，不填空白处的标记时间。前一轮已完成、后面开始等价目标时，选“同一种事，重新做一次”。</div>
<div class="layout">
<section class="viewer"><video id="video" controls preload="metadata"></video><div id="videoError" class="video-error" role="alert" hidden><p id="videoErrorText"></p><button type="button" id="pickFolder">选择 videos 文件夹</button><input id="videoFolder" type="file" webkitdirectory directory multiple accept="video/mp4" hidden></div><p id="videoOk" class="video-ok" aria-live="polite"></p><div class="tools"><button type="button" id="candidate">跳到标记处</button><button type="button" data-speed="1">1x</button><button type="button" data-speed="2">2x</button><span class="clock" id="clock"></span></div><p class="hint">先看完整段，再回到标记处核对。关闭页面后，草稿仍保存在这个浏览器里。</p></section>
<form id="form">
<fieldset class="step"><legend class="required">1. 标记的位置发生了什么？</legend><div class="relations">
<label class="relation"><input type="radio" name="relation" value="CONTINUE"><span><b>继续同一件事</b><small>目标没变，也没有看到上一次结束。</small></span></label>
<label class="relation"><input type="radio" name="relation" value="SAME_ACTION_NEW_INSTANCE"><span><b>同一种事，重新做一次</b><small>上一次已完成、放弃或重置，又开始同类目标。</small></span></label>
<label class="relation"><input type="radio" name="relation" value="NEW_ACTION"><span><b>换了另一种事</b><small>眼前要达成的结果变了。</small></span></label>
<label class="relation"><input type="radio" name="relation" value="BOUNDARY_TYPE_UNRESOLVED"><span><b>确定开始新一段，但看不清是不是同一种事</b></span></label>
<label class="relation"><input type="radio" name="relation" value="UNOBSERVABLE"><span><b>看不清有没有换</b><small>连是否出现新的一段都无法判断。</small></span></label>
</div><details id="rare"><summary>特殊情况</summary><div class="relations"><label class="relation"><input type="radio" name="relation" value="END_ONLY"><span><b>只看到结束</b><small>完整视频里没有出现后续新目标。</small></span></label><label class="relation"><input type="radio" name="relation" value="INITIAL"><span><b>视频开始时已在做</b></span></label><label class="relation"><input type="radio" name="relation" value="TERMINAL"><span><b>视频结束时仍在做</b></span></label></div></details></fieldset>
<fieldset class="step"><legend>2. 必须确认</legend><div class="fields">
<div class="field hidden" id="priorField"><label class="required" for="prior_episode_status">前一件事后来怎样了？</label><select id="prior_episode_status"></select></div>
<div class="field hidden" id="returnField"><label class="required" for="return_to_prior_type">这是回到更早做过的那种事吗？</label><select id="return_to_prior_type"><option value="">请选择</option><option value="no">不是</option><option value="yes">是</option><option value="unknown">看不清</option></select></div>
<div class="field hidden" id="instanceField"><label class="required" for="instance_link">回来后是接着做，还是重新开始？</label><select id="instance_link"><option value="">请选择</option><option value="resumed_instance">接着做之前没做完的那一次</option><option value="new_instance">开始全新的一次</option><option value="unknown">看不清</option></select></div>
<div class="field hidden" id="boundaryField"><label class="required">变化发生在视频第几秒？</label><div class="time"><input id="boundary_start_s" type="number" min="0" step="0.1" placeholder="开始秒数"><button type="button" data-set="boundary_start_s">取当前时间</button><input id="boundary_end_s" type="number" min="0" step="0.1" placeholder="结束秒数，可不填"><button type="button" data-set="boundary_end_s">取当前时间</button></div><p class="hint">明确时只填开始；看不准时填起止范围。</p></div>
<div class="field hidden" id="transitionField"><label class="required" for="transition_shape">这个变化是怎样发生的？</label><select id="transition_shape"><option value="">请选择</option><option value="sharp">一下子变了</option><option value="gradual">慢慢变了</option><option value="uncertain">看不清</option></select></div>
<div class="field"><label class="required" for="visibility">关键画面看得清吗？</label><select id="visibility"><option value="">请选择</option><option value="visible">看得清</option><option value="partial">只能看清一部分</option><option value="not_visible">关键画面没拍到</option></select></div>
</div><details><summary>可选线索：接触和松手</summary><div class="fields"><div class="field"><label for="continuous_contact">一直有接触？</label><select id="continuous_contact"><option value="">未记录</option><option value="yes">是</option><option value="no">否</option><option value="uncertain">看不清</option></select></div><div class="field"><label for="release_observed">看到松手？</label><select id="release_observed"><option value="">未记录</option><option value="yes">是</option><option value="no">否</option><option value="uncertain">看不清</option></select></div></div></details></fieldset>
<fieldset class="step"><legend>3. 填完四个空</legend><div class="evidence">
<label><span class="required">之前在做什么？</span><input id="evidence_before" type="text" maxlength="250"></label>
<label><span class="required">之后在做什么？</span><input id="evidence_after" type="text" maxlength="250"></label>
<label><span class="required">你看到了什么关键画面？</span><input id="evidence_cue" type="text" maxlength="500"></label>
<label><span class="required">所以你判断什么？</span><input id="evidence_judgment" type="text" maxlength="250" list="judgments"></label>
</div><datalist id="judgments"><option value="继续同一件事"><option value="同一种事，重新做一次"><option value="换了另一种事"><option value="确定开始新一段，但看不清是不是同一种事"><option value="看不清有没有换"></datalist><p class="preview"><b>整句话：</b><span id="preview">填写后会自动合成。</span></p></fieldset>
<div class="actions"><label class="required"><input type="checkbox" id="human_confirmed"> 我已看完整段视频</label><button type="button" id="draft">保存草稿</button><button id="submit">提交本条</button></div><div id="alert" role="alert"></div>
</form></div>
<div class="nav"><button id="previous" type="button">上一条</button><button id="next" type="button">下一条</button></div>
<section class="case-panel"><b>30 条进度</b><div class="case-list" id="caseList"></div></section>
<section class="export"><strong>结果文件</strong><button type="button" id="exportCsv">导出最终 CSV</button><button type="button" id="exportBackup">导出备份 JSON</button><label><input type="file" id="importBackup" accept="application/json,.json" hidden><button type="button" id="importButton">恢复备份</button></label><span class="export-note" id="exportNote">完成 30 条后，把 CSV 文件发回即可。</span></section>
</main>
<script>
const CASES=__CASES__;
const MANIFEST_HASH='__MANIFEST_HASH__';
const STORAGE_KEY='graph-contract-offline-reviewer-2-'+MANIFEST_HASH;
const $=s=>document.querySelector(s), form=$('#form'), video=$('#video');
const evidenceIds=['evidence_before','evidence_after','evidence_cue','evidence_judgment'];
const directFields=['prior_episode_status','return_to_prior_type','instance_link','boundary_start_s','boundary_end_s','transition_shape','continuous_contact','release_observed','visibility'];
let current=0, states=loadAll(), dirty=false, chosenVideos=new Map(), videoObjectUrl=null, videoTimer=null;
function blank(id){return{review_id:id,revision:0,status:'not_started'}}
function loadAll(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch{return{}}}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(states))}
function relation(){return document.querySelector('[name=relation]:checked')?.value||''}
function evidence(){const x=evidenceIds.map(id=>$('#'+id).value.trim());return x.some(Boolean)?`之前在${x[0]}；之后在${x[1]}；因为看到${x[2]}，所以我判断${x[3]}。`:''}
function setChoices(target,choices,value=''){target.replaceChildren(...choices.map(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;return o}));target.value=value}
const priorChoices={SAME_ACTION_NEW_INSTANCE:[['','请选择'],['completed','已经做完'],['terminated','已放弃或重新开始']],NEW_ACTION:[['','请选择'],['completed','已经做完'],['terminated','已停止或放弃'],['suspended','暂时停下，可能接着做'],['coactive','两件事同时在做'],['unknown','看不清']],BOUNDARY_TYPE_UNRESOLVED:[['','请选择'],['completed','已经做完'],['terminated','已停止或放弃'],['suspended','暂时停下，可能接着做'],['coactive','两件事同时在做'],['unknown','看不清']],END_ONLY:[['','请选择'],['completed','已经做完'],['terminated','已停止或放弃'],['unknown','看不清']]};
function questions(keep=true){const r=relation(), prior=$('#prior_episode_status').value, hasPrior=r in priorChoices;$('#priorField').classList.toggle('hidden',!hasPrior);if(hasPrior)setChoices($('#prior_episode_status'),priorChoices[r],keep?prior:'');$('#returnField').classList.toggle('hidden',r!=='NEW_ACTION');$('#instanceField').classList.toggle('hidden',!(r==='NEW_ACTION'&&$('#return_to_prior_type').value==='yes'));const boundary=['SAME_ACTION_NEW_INSTANCE','NEW_ACTION','BOUNDARY_TYPE_UNRESOLVED','END_ONLY'].includes(r);$('#boundaryField').classList.toggle('hidden',!boundary);const overlap=['NEW_ACTION','BOUNDARY_TYPE_UNRESOLVED'].includes(r)&&$('#prior_episode_status').value==='coactive';$('#transitionField').classList.toggle('hidden',!boundary||overlap)}
function derived(){const r=relation(), prior=$('#prior_episode_status').value;const x={review_id:CASES[current].review_id,relation:r,type_equivalence:'',prior_episode_status:'',next_episode_status:'',return_to_prior_type:'',instance_link:'',observed_type_path:'',boundary_start_s:'',boundary_end_s:'',transition_shape:'',continuous_contact:$('#continuous_contact').value||'uncertain',release_observed:$('#release_observed').value||'uncertain',overlap_present:'',visibility:$('#visibility').value,observable_evidence:evidence(),human_confirmed:$('#human_confirmed').checked};if(r==='CONTINUE')Object.assign(x,{type_equivalence:'same',prior_episode_status:'ongoing',next_episode_status:'ongoing',return_to_prior_type:'not_applicable',instance_link:'same_instance',observed_type_path:'A',transition_shape:'no_transition',overlap_present:'no'});if(r==='SAME_ACTION_NEW_INSTANCE')Object.assign(x,{type_equivalence:'same',prior_episode_status:prior,next_episode_status:'new',return_to_prior_type:'not_applicable',instance_link:'new_instance',observed_type_path:'A>A',transition_shape:$('#transition_shape').value,overlap_present:'no'});if(r==='NEW_ACTION'){const ret=$('#return_to_prior_type').value,link=ret==='yes'?$('#instance_link').value:(ret==='no'?'new_instance':'unknown');Object.assign(x,{type_equivalence:'different',prior_episode_status:prior,next_episode_status:link==='resumed_instance'?'resumed':(link==='unknown'?'unknown':'new'),return_to_prior_type:ret,instance_link:link,observed_type_path:ret==='yes'?'A>B>A':(ret==='no'?'A>B':''),transition_shape:prior==='coactive'?'overlap':$('#transition_shape').value,overlap_present:prior==='coactive'?'yes':(prior==='unknown'?'uncertain':'no')})}if(r==='BOUNDARY_TYPE_UNRESOLVED')Object.assign(x,{type_equivalence:'unknown',prior_episode_status:prior,next_episode_status:'new',return_to_prior_type:'unknown',instance_link:'unknown',transition_shape:prior==='coactive'?'overlap':$('#transition_shape').value,overlap_present:prior==='coactive'?'yes':(prior==='unknown'?'uncertain':'no')});if(r==='UNOBSERVABLE')Object.assign(x,{type_equivalence:'unknown',prior_episode_status:'unknown',next_episode_status:'unknown',return_to_prior_type:'unknown',instance_link:'unknown',transition_shape:'uncertain',overlap_present:'uncertain'});if(r==='END_ONLY')Object.assign(x,{type_equivalence:'not_applicable',prior_episode_status:prior,next_episode_status:'not_applicable',return_to_prior_type:'not_applicable',instance_link:'not_applicable',transition_shape:$('#transition_shape').value,overlap_present:'no'});if(['INITIAL','TERMINAL'].includes(r))Object.assign(x,{type_equivalence:'not_applicable',prior_episode_status:'not_applicable',next_episode_status:'not_applicable',return_to_prior_type:'not_applicable',instance_link:'not_applicable',transition_shape:'no_transition',overlap_present:'no'});if(['SAME_ACTION_NEW_INSTANCE','NEW_ACTION','BOUNDARY_TYPE_UNRESOLVED','END_ONLY'].includes(r)){x.boundary_start_s=$('#boundary_start_s').value;x.boundary_end_s=$('#boundary_end_s').value}return x}
function fail(target,message){$('#alert').textContent=message;$(target)?.focus();return false}
function valid(){const r=relation(),c=CASES[current];if(!r)return fail('[name=relation]','请先选择标记的位置发生了什么。');if(!$('#priorField').classList.contains('hidden')&&!$('#prior_episode_status').value)return fail('#prior_episode_status','请选择前一件事后来怎样了。');if(!$('#returnField').classList.contains('hidden')&&!$('#return_to_prior_type').value)return fail('#return_to_prior_type','请选择是否回到更早做过的那种事。');if(!$('#instanceField').classList.contains('hidden')&&!$('#instance_link').value)return fail('#instance_link','请选择接着做或重新开始。');if(!$('#boundaryField').classList.contains('hidden')){const a=$('#boundary_start_s').value,b=$('#boundary_end_s').value;if(a==='')return fail('#boundary_start_s','请填写实际变化开始的秒数。');if(+a<0||+a>c.duration_s||(b!==''&&(+b<+a||+b>c.duration_s)))return fail('#boundary_start_s','秒数必须在视频范围内，且开始不能晚于结束。')}if(!$('#transitionField').classList.contains('hidden')&&!$('#transition_shape').value)return fail('#transition_shape','请选择变化方式。');if(!$('#visibility').value)return fail('#visibility','请选择关键画面是否看得清。');for(const id of evidenceIds)if(!$('#'+id).value.trim())return fail('#'+id,'请填完四个空。');if(!$('#human_confirmed').checked)return fail('#human_confirmed','请看完整段视频并勾选确认。');$('#alert').textContent='';return true}
function save(status){const id=CASES[current].review_id,old=states[id]||blank(id),x=derived();states[id]={...x,schema_version:'interaction_graph_contract_human_review_v1',revision:(old.revision||0)+1,status,reviewer_id:'reviewer_2',manifest_sha256:MANIFEST_HASH,saved_at:new Date().toISOString()};persist();dirty=false;renderProgress();$('#alert').textContent=status==='final'?'本条已提交，可以继续下一条。':'草稿已保存在本机。'}
function restoreEvidence(text){evidenceIds.forEach(id=>$('#'+id).value='');const m=(text||'').match(/^之前在(.*?)；之后在(.*?)；因为看到(.*?)，所以我判断(.*?)。?$/);if(m)evidenceIds.forEach((id,i)=>$('#'+id).value=m[i+1]);renderPreview()}
function renderPreview(){$('#preview').textContent=evidence()||'填写后会自动合成。'}
function videoProblem(reason){const name=CASES[current].review_id+'.mp4';$('#videoOk').textContent='';$('#videoErrorText').textContent=`${reason} 当前需要 videos/${name}。请先完整解压 ZIP，确认打开标注页面.html 旁边有 videos 文件夹；不要在压缩包预览或微信内打开。也可以点下面的按钮，手动选择解压后的 videos 文件夹。`;$('#videoError').hidden=false}
function loadVideo(){clearTimeout(videoTimer);video.pause();video.removeAttribute('src');video.load();if(videoObjectUrl){URL.revokeObjectURL(videoObjectUrl);videoObjectUrl=null}$('#videoError').hidden=true;$('#videoOk').textContent='';const name=CASES[current].review_id+'.mp4',file=chosenVideos.get(name);if(file){videoObjectUrl=URL.createObjectURL(file);video.src=videoObjectUrl}else video.src='videos/'+name;video.load();videoTimer=setTimeout(()=>{if(video.readyState<1)videoProblem('尚未读到视频。')},4000)}
function show(index){if(dirty)save('draft');current=index;const c=CASES[current],s=states[c.review_id]||blank(c.review_id);form.reset();document.querySelectorAll('[name=relation]').forEach(x=>x.checked=x.value===s.relation);if(['END_ONLY','INITIAL','TERMINAL'].includes(s.relation))$('#rare').open=true;questions(false);for(const k of directFields)if(s[k]!==undefined&&$('#'+k))$('#'+k).value=s[k];questions(true);restoreEvidence(s.observable_evidence);$('#human_confirmed').checked=s.human_confirmed===true;loadVideo();$('#caseTitle').textContent=`第 ${current+1} / 30 条`;$('#clock').textContent=`标记处 ${c.candidate_offset_s.toFixed(1)} 秒`;$('#previous').disabled=current===0;$('#next').disabled=current===CASES.length-1;$('#alert').textContent=s.status==='final'?'本条已提交。':(s.status==='draft'?'已恢复本机草稿。':'');dirty=false;renderProgress();scrollTo({top:0,behavior:'smooth'})}
function renderProgress(){const finals=CASES.filter(c=>states[c.review_id]?.status==='final').length;$('#progress').textContent=`已提交 ${finals} / 30`;$('#exportCsv').disabled=finals!==30;$('#exportNote').innerHTML=finals===30?'<span class="ok">30 条已完成，请导出最终 CSV 并发回。</span>':`还差 ${30-finals} 条。完成后导出最终 CSV。`;const list=$('#caseList');list.replaceChildren(...CASES.map((c,i)=>{const b=document.createElement('button');b.type='button';b.textContent=String(i+1).padStart(2,'0');b.className=(states[c.review_id]?.status||'')+(i===current?' current':'');b.title=states[c.review_id]?.status==='final'?'已提交':(states[c.review_id]?.status==='draft'?'草稿':'未开始');b.onclick=()=>show(i);return b}))}
function csvCell(v){const s=String(v??'');return /[",\r\n]/.test(s)?'"'+s.replaceAll('"','""')+'"':s}
const columns=['review_id','relation','type_equivalence','prior_episode_status','next_episode_status','return_to_prior_type','instance_link','observed_type_path','boundary_start_s','boundary_end_s','transition_shape','continuous_contact','release_observed','overlap_present','visibility','observable_evidence','reviewer_id','human_confirmed','schema_version','revision','status','manifest_sha256','saved_at'];
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#exportCsv').onclick=()=>{const rows=CASES.map(c=>states[c.review_id]);if(rows.some(x=>x?.status!=='final'))return;download('reviewer_2_graph_contract_review.csv',[columns.join(','),...rows.map(r=>columns.map(k=>csvCell(r[k])).join(','))].join('\r\n'),'text/csv;charset=utf-8')};
$('#exportBackup').onclick=()=>download('reviewer_2_backup.json',JSON.stringify({schema_version:'interaction_graph_contract_offline_backup_v1',manifest_sha256:MANIFEST_HASH,states},null,2),'application/json');
$('#importButton').onclick=()=>$('#importBackup').click();$('#importBackup').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(data.manifest_sha256!==MANIFEST_HASH||!data.states)throw Error('备份不属于这一批视频。');states=data.states;persist();show(current)}catch(error){$('#alert').textContent=error.message}e.target.value=''};
$('#pickFolder').onclick=()=>$('#videoFolder').click();
$('#videoFolder').onchange=e=>{chosenVideos=new Map([...e.target.files].filter(file=>file.name.endsWith('.mp4')).map(file=>[file.name,file]));if(!chosenVideos.has(CASES[current].review_id+'.mp4'))videoProblem(`已选择 ${chosenVideos.size} 个 MP4，但没有找到当前视频。`);else loadVideo();e.target.value=''};
video.onerror=()=>videoProblem(video.error?.code===3?'浏览器无法解码这个视频。':'视频文件无法打开。');
video.onloadedmetadata=()=>{clearTimeout(videoTimer);$('#videoError').hidden=true;$('#videoOk').textContent=`视频已加载：${video.duration.toFixed(1)} 秒`};
form.oninput=e=>{questions();if(evidenceIds.includes(e.target.id))renderPreview();if(e.target.id!=='human_confirmed')$('#human_confirmed').checked=false;dirty=true};
$('#draft').onclick=()=>save('draft');form.onsubmit=e=>{e.preventDefault();if(valid()){save('final');if(current<CASES.length-1)setTimeout(()=>show(current+1),350)}};$('#previous').onclick=()=>show(current-1);$('#next').onclick=()=>show(current+1);$('#candidate').onclick=()=>{video.currentTime=CASES[current].candidate_offset_s;video.pause()};video.ontimeupdate=()=>$('#clock').textContent=`${video.currentTime.toFixed(1)} 秒 / 标记处 ${CASES[current].candidate_offset_s.toFixed(1)} 秒`;document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>video.playbackRate=+b.dataset.speed);document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{$('#'+b.dataset.set).value=video.currentTime.toFixed(1);form.dispatchEvent(new Event('input'))});window.onbeforeunload=()=>{if(dirty)save('draft')};
show(0);
</script>
</body></html>
