<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{color-scheme:dark;--bg:#111513;--panel:#191e1b;--line:#46504a;--text:#f3f5f3;--muted:#b5bdb8;--accent:#72cdaa;--accent2:#2f7558;--warn:#efbd69;--danger:#ef9187}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 system-ui,sans-serif;letter-spacing:0}button,select,input,textarea{font:inherit;color:var(--text);background:#252c28;border:1px solid #68736d;border-radius:4px}button{min-height:46px;padding:8px 12px;cursor:pointer}button:hover{background:#343d38}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button:disabled{opacity:.45;cursor:default}header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;min-height:58px;padding:9px 18px;background:var(--panel);border-bottom:1px solid var(--line)}header h1{font-size:18px;margin:0}.progress{margin-left:auto;color:var(--muted)}main{max-width:1500px;margin:auto;padding:18px}.rule{border-left:4px solid var(--accent);background:#1d2722;padding:12px 15px;margin-bottom:16px}.rule b{display:block;margin-bottom:4px}.rule span{display:block;color:var(--muted)}.workspace{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(360px,.75fr);gap:22px;align-items:start}.viewer{position:sticky;top:76px;min-width:0}video{display:block;width:100%;max-height:60vh;aspect-ratio:4/3;object-fit:contain;background:#000}.timelineShell{position:relative;margin-top:10px}.rail{height:56px;border:1px solid var(--line);background:#222824;position:relative;overflow:hidden;touch-action:none}.rail button{position:absolute;top:0;height:100%;border:0;border-right:2px solid #111;border-radius:0;padding:0;min-height:0;color:#111;font-weight:800;overflow:hidden}.rail button.selected{outline:3px solid #fff;outline-offset:-4px}.rail .boundary{z-index:6;width:24px;transform:translateX(-50%);border:0;background:transparent!important;cursor:ew-resize;overflow:visible}.rail .boundary:before{content:"";position:absolute;left:10px;top:5px;bottom:5px;width:4px;border:1px solid #111;background:#fff}.playhead{position:absolute;z-index:8;top:-6px;bottom:-5px;width:2px;background:#fff;pointer-events:none;transform:translateX(-1px)}.ticks{display:flex;justify-content:space-between;color:var(--muted);font:12px ui-monospace,monospace;padding-top:4px}.toolbar,.nav,.export{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:10px}.primary{background:var(--accent2);border-color:var(--accent)}.clock{font:15px ui-monospace,monospace;color:var(--muted)}.videoError{border-left:4px solid var(--danger);background:#342724;padding:10px;margin-top:10px}.side{border-left:1px solid var(--line);padding-left:22px;min-width:0}.selectedTitle{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}.segmentNavigator{display:grid;grid-template-columns:48px minmax(92px,auto) 48px;gap:8px;align-items:center}.segmentNavigator button{width:48px;height:48px;padding:0;font-size:26px}.segmentNavigator strong{text-align:center;white-space:nowrap}.selectedTitle>span{font:14px ui-monospace,monospace;color:var(--muted)}.boundaryEditor{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-weight:750}.field select,.field textarea{width:100%;padding:10px}.field textarea{min-height:76px;resize:vertical}.relation{padding:10px 12px;border-left:4px solid var(--warn);background:#29271f;margin-bottom:14px}.relation.good{border-color:var(--accent);background:#1e2b25}.check{display:flex;gap:10px;align-items:flex-start;margin:14px 0}.check input{width:22px;height:22px;flex:none}.muted{color:var(--muted)}.danger{color:#ffc1bb}.section{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}.eventRow{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;margin-bottom:9px}.swatch,.eventBadge,.node{display:inline-grid;place-items:center;border-radius:50%;color:#111;font-weight:900}.swatch{width:28px;height:28px}.eventBadge{width:34px;height:34px}.notice{min-height:30px;color:#ffc1bb;margin-top:10px}.segments,.graph,.finish{grid-column:1/-1}.segments h2,.graph h2{font-size:18px;margin:0 0 10px}.segment{display:grid;grid-template-columns:58px 145px 70px minmax(170px,1fr) auto;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #303833}.segment.selected{background:#24342c}.sequence{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.node{min-width:38px;height:38px}.finish{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:16px}.finish .check{margin:0 auto 0 0}.caseList{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:10px}.caseList button{min-width:0;padding:7px;font-size:14px}.caseList button.final{background:#28533f}.caseList button.draft{background:#5a4929}.caseList button.current{outline:3px solid var(--accent)}.export{margin-top:18px;padding:14px;background:var(--panel);border:1px solid var(--line)}
@media(max-width:980px){main{padding:12px}.workspace{grid-template-columns:1fr}.viewer{position:static}.side{border-left:0;border-top:1px solid var(--line);padding:18px 0 0}.caseList{grid-template-columns:repeat(6,1fr)}}@media(max-width:600px){header{padding:9px 12px;align-items:flex-start;flex-wrap:wrap}header h1{max-width:65%}.progress{white-space:nowrap}.rule{font-size:15px}.segment{grid-template-columns:48px 1fr 60px}.segment .summary{grid-column:1/4}.caseList{grid-template-columns:repeat(5,1fr)}.boundaryEditor{grid-template-columns:1fr}.finish{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:grid;grid-template-columns:1fr 1fr}.finish .check{grid-column:1/-1;margin:0}.finish button{width:100%}}
</style>
<header><h1>__TITLE__</h1><span id="caseTitle"></span><span class="progress" id="progress"></span></header>
<main>
<section class="rule"><b>只记三件事</b><span>同一次继续做（包括来回擦、反复拧）：不要切。</span><span>同一种事结束后重新开始：切开，右边继续选原来的事件。</span><span>目标换了：切开，右边新建或选择另一个事件。</span></section>
<div class="workspace">
<section class="viewer">
  <video id="video" controls preload="metadata"></video>
  <div id="videoError" class="videoError" hidden><span id="videoErrorText"></span> <button id="pickFolder">选择 videos 文件夹</button><input id="videoFolder" type="file" webkitdirectory directory multiple accept="video/mp4" hidden></div>
  <div class="timelineShell"><div class="rail" id="rail"></div><div class="playhead" id="playhead"></div></div><div class="ticks" id="ticks"></div>
  <div class="toolbar"><button id="cut" class="primary">在当前时间切开</button><span class="clock" id="clock"></span><button data-speed="0.5">0.5x</button><button data-speed="1">1x</button><button data-speed="2">2x</button></div>
</section>
<aside class="side">
  <div class="selectedTitle"><div class="segmentNavigator"><button id="prevSegment" title="上一段">←</button><strong id="segmentTitle"></strong><button id="nextSegment" title="下一段">→</button></div><span id="segmentTime"></span></div>
  <div class="boundaryEditor"><button id="setStart">把开头改到当前时间</button><button id="setEnd">把结尾改到当前时间</button></div>
  <div id="relation" class="relation"></div>
  <div class="field"><label for="eventSelect">这一段在做什么？</label><select id="eventSelect"></select></div><button id="newEvent">新建一种事件</button>
  <div class="field section"><label for="eventDescription">用一句话描述这个事件</label><textarea id="eventDescription" placeholder="写清楚：动词 + 物体"></textarea></div>
  <label class="check"><input id="repeats" type="checkbox"><span><b>这一段里面有反复</b><br><span class="muted">例如同一次任务里来回擦、反复拧，不另切段。</span></span></label>
  <div class="field"><label for="segmentNote">补充说明（可不填）</label><textarea id="segmentNote"></textarea></div>
  <button id="merge" class="danger">和上一段合并</button>
  <div class="section"><b>已经创建的事件</b><div id="eventLibrary"></div></div><div class="notice" id="notice" role="alert"></div>
</aside>
<section class="segments section"><h2>全部时间段</h2><div id="segmentList"></div></section>
<section class="graph section"><h2>当前路径</h2><div class="sequence" id="sequence"></div><p class="muted" id="edgeSummary"></p></section>
<footer class="finish"><label class="check"><input id="confirmed" type="checkbox"><span>我已从头到尾看完并检查每一段</span></label><button id="draft">保存草稿</button><button id="submit" class="primary">提交本条</button></footer>
</div>
<div class="nav"><button id="previous">上一条视频</button><button id="next">下一条视频</button></div>
<section class="section"><b>30 条进度</b><div class="caseList" id="caseList"></div></section>
<section class="export"><b>结果文件</b><button id="exportJson">导出最终 JSON</button><button id="exportCsv">导出分段 CSV</button><button id="exportBackup">导出草稿备份</button><button id="importButton">恢复草稿备份</button><input id="importBackup" type="file" accept="application/json,.json" hidden><span class="muted" id="exportNote"></span></section>
</main>
<script>
const CASES=__CASES__, MANIFEST_HASH='__MANIFEST_HASH__', ANNOTATOR='__ANNOTATOR_ID__', BATCH='__BATCH_ID__';
const STORAGE_KEY='interaction-graph-timeline-'+BATCH+'-'+ANNOTATOR+'-'+MANIFEST_HASH;
const $=s=>document.querySelector(s), video=$('#video'), colors=['#83c5be','#f3c677','#e69a8d','#9db4e0','#c0a6da','#90c989','#e6b566','#80b7c9','#d6a3b2','#b4c37b'];
let current=0,selected=0,states=loadAll(),chosenVideos=new Map(),videoUrl=null,dragBoundary=null,dirty=false;
function loadAll(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch{return{}}}
function blank(c){return{schema_version:'interaction_graph_timeline_v1',video_id:c.video_id,events:[],segments:[{start_s:0,end_s:c.duration_s,event_id:'',repeats_within_segment:false,note:''}],confirmed_full_video:false,status:'not_started',revision:0}}
function state(){return states[CASES[current].video_id]||(states[CASES[current].video_id]=blank(CASES[current]))}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(states));dirty=false;renderProgress()}
function touch(){const s=state();s.status=s.status==='final'?'draft':'draft';s.revision=(s.revision||0)+1;s.saved_at=new Date().toISOString();dirty=true;persist()}
function n(x){return Math.round(x*10)/10}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function letterId(value){let x='';while(value){value--;x=String.fromCharCode(65+value%26)+x;value=Math.floor(value/26)}return x}
function nextId(){const used=new Set(state().events.map(e=>e.event_id));for(let i=1;;i++){const id=letterId(i);if(!used.has(id))return id}}
function eventById(id){return state().events.find(e=>e.event_id===id)}function color(id){const i=state().events.findIndex(e=>e.event_id===id);return colors[(i<0?0:i)%colors.length]}
function createEvent(){const id=nextId();state().events.push({event_id:id,description:''});state().segments[selected].event_id=id;touch();render();setTimeout(()=>$('#eventDescription').focus(),0)}
function cut(){const s=state(),at=n(video.currentTime),i=s.segments.findIndex(x=>at>x.start_s+.1&&at<x.end_s-.1);if(i<0)return notice('把播放位置放在某一段中间再切。');const old=s.segments[i],left={...old,end_s:at},right={start_s:at,end_s:old.end_s,event_id:'',repeats_within_segment:false,note:''};s.segments.splice(i,1,left,right);selected=i+1;touch();render();notice('已切开。现在选择：同一种事就选原事件，换目标就新建事件。')}
function merge(){const s=state();if(selected===0)return;const a=s.segments[selected-1],b=s.segments[selected];if(a.event_id&&b.event_id&&a.event_id!==b.event_id&&!confirm('两段事件不同。合并后保留上一段，继续吗？'))return;a.end_s=b.end_s;a.repeats_within_segment=a.repeats_within_segment||b.repeats_within_segment;a.note=[a.note,b.note].filter(Boolean).join('；');s.segments.splice(selected,1);selected--;touch();render()}
function choose(i,seek=true){selected=Math.max(0,Math.min(i,state().segments.length-1));if(seek)video.currentTime=state().segments[selected].start_s;render()}
function moveBoundary(index,time,preview=false){const ss=state().segments;if(index<=0||index>=ss.length)return false;const left=ss[index-1],right=ss[index],low=n(left.start_s+.1),high=n(right.end_s-.1);if(low>high)return false;const at=Math.max(low,Math.min(high,n(time)));left.end_s=at;right.start_s=at;if(preview){video.pause();video.currentTime=at}render();return true}
function boundaryTime(x){const b=$('#rail').getBoundingClientRect();return n(Math.max(0,Math.min(1,(x-b.left)/b.width))*CASES[current].duration_s)}
function setBoundary(side){const index=side==='start'?selected:selected+1;if(moveBoundary(index,video.currentTime,true))touch()}
function relationText(){const ss=state().segments,cur=ss[selected];if(selected===0)return cur.event_id?'视频开头的事件。':'先选择这一段在做什么。';if(!cur.event_id)return '切点后还没选择事件。';const prev=ss[selected-1];if(!prev.event_id)return '上一段还没选择事件。';return cur.event_id===prev.event_id?'同一种事，新一轮：'+prev.event_id+' → '+cur.event_id:'换成另一种事：'+prev.event_id+' → '+cur.event_id}
function renderSelect(){const s=state(),seg=s.segments[selected],sel=$('#eventSelect');sel.innerHTML='<option value="">请选择</option>'+s.events.map(e=>'<option value="'+e.event_id+'">事件 '+e.event_id+(e.description?'：'+esc(e.description):'')+'</option>').join('');sel.value=seg.event_id;const ev=eventById(seg.event_id);$('#eventDescription').value=ev?.description||'';$('#eventDescription').disabled=!ev;$('#repeats').checked=seg.repeats_within_segment;$('#segmentNote').value=seg.note||'';$('#confirmed').checked=!!s.confirmed_full_video;$('#merge').disabled=selected===0;$('#setStart').disabled=selected===0;$('#setEnd').disabled=selected===s.segments.length-1;$('#prevSegment').disabled=selected===0;$('#nextSegment').disabled=selected===s.segments.length-1;$('#segmentTitle').textContent='第 '+(selected+1)+' / '+s.segments.length+' 段';$('#segmentTime').textContent=seg.start_s.toFixed(1)+' – '+seg.end_s.toFixed(1)+' 秒';const r=$('#relation');r.textContent=relationText();r.classList.toggle('good',!!seg.event_id)}
function renderRail(){const s=state(),duration=CASES[current].duration_s,rail=$('#rail');rail.innerHTML='';s.segments.forEach((x,i)=>{const b=document.createElement('button'),w=100*(x.end_s-x.start_s)/duration;b.style.left=100*x.start_s/duration+'%';b.style.width=w+'%';b.style.background=x.event_id?color(x.event_id):'#737975';b.textContent=w>=4?(x.event_id||'?'):'';b.classList.toggle('selected',i===selected);b.title='第 '+(i+1)+' 段';b.onclick=e=>{const box=rail.getBoundingClientRect();video.currentTime=Math.max(x.start_s,Math.min(x.end_s,(e.clientX-box.left)/box.width*duration));choose(i,false);updateTime()};rail.appendChild(b)});for(let i=1;i<s.segments.length;i++){const h=document.createElement('button');h.className='boundary';h.style.left=100*s.segments[i].start_s/duration+'%';h.title='拖动调整；聚焦后按左右方向键微调';h.onpointerdown=e=>{e.preventDefault();e.stopPropagation();dragBoundary=i;moveBoundary(i,boundaryTime(e.clientX),true)};h.onclick=e=>e.stopPropagation();h.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const at=s.segments[i].start_s+(e.key==='ArrowLeft'?-.1:.1);if(moveBoundary(i,at,true))touch()}};rail.appendChild(h)}}
function renderSegments(){const root=$('#segmentList');root.innerHTML='';state().segments.forEach((x,i)=>{const row=document.createElement('div');row.className='segment'+(i===selected?' selected':'');row.innerHTML='<b>#'+(i+1)+'</b><span>'+x.start_s.toFixed(1)+' – '+x.end_s.toFixed(1)+' 秒</span>'+(x.event_id?'<span class="eventBadge" style="background:'+color(x.event_id)+'">'+x.event_id+'</span>':'<span style="color:#ffc1bb">未选</span>')+'<span class="summary">'+esc(x.note||eventById(x.event_id)?.description||'')+(x.repeats_within_segment?' · 段内反复':'')+'</span><button>查看</button>';row.querySelector('button').onclick=()=>choose(i);root.appendChild(row)})}
function renderLibrary(){const s=state(),root=$('#eventLibrary');root.innerHTML='';s.events.forEach((e,i)=>{const used=s.segments.filter(x=>x.event_id===e.event_id).length,row=document.createElement('div');row.className='eventRow';row.innerHTML='<span class="swatch" style="background:'+color(e.event_id)+'">'+e.event_id+'</span><span>'+(e.description?esc(e.description):'<span style="color:#ffc1bb">请写描述</span>')+' · '+used+' 段</span><button '+(used?'disabled':'')+'>删除</button>';row.querySelector('button').onclick=()=>{s.events.splice(i,1);touch();render()};root.appendChild(row)});if(!s.events.length)root.innerHTML='<p class="muted">还没有事件</p>'}
function renderGraph(){const ids=state().segments.map(x=>x.event_id).filter(Boolean),root=$('#sequence');root.innerHTML='';ids.forEach((id,i)=>{if(i)root.insertAdjacentHTML('beforeend','<span class="muted">→</span>');const x=document.createElement('span');x.className='node';x.style.background=color(id);x.textContent=id;root.appendChild(x)});if(!ids.length)root.innerHTML='<span class="muted">选择事件后显示路径</span>';const edges={};state().segments.forEach(x=>{if(x.event_id&&x.repeats_within_segment)edges[x.event_id+'→'+x.event_id]=(edges[x.event_id+'→'+x.event_id]||0)+1});for(let i=1;i<ids.length;i++){const k=ids[i-1]+'→'+ids[i];edges[k]=(edges[k]||0)+1}$('#edgeSummary').textContent=Object.entries(edges).map(([k,v])=>k+' ×'+v).join('，')}
function render(){selected=Math.min(selected,state().segments.length-1);renderSelect();renderRail();renderSegments();renderLibrary();renderGraph()}
function notice(x){$('#notice').textContent=x}
function validate(){const s=state(),missing=s.segments.findIndex(x=>!x.event_id);if(missing>=0){choose(missing);notice('第 '+(missing+1)+' 段还没有选择事件。');return false}const descriptions=new Map(s.events.map(e=>[e.event_id,e.description.trim()]));const empty=s.segments.find(x=>!descriptions.get(x.event_id));if(empty){notice('请给每个用到的事件写一句描述。');return false}if(!s.confirmed_full_video){notice('请先勾选“从头到尾看完”。');return false}return true}
function save(status){const s=state();s.status=status;s.annotator=ANNOTATOR;s.manifest_sha256=MANIFEST_HASH;s.saved_at=new Date().toISOString();s.revision=(s.revision||0)+1;persist();notice(status==='final'?'本条已提交。':'草稿已保存在这台电脑的浏览器里。')}
function show(index){if(dirty)save('draft');current=index;selected=0;loadVideo();renderTicks();render();renderProgress();$('#caseTitle').textContent='第 '+(current+1)+' / '+CASES.length+' 条';$('#previous').disabled=current===0;$('#next').disabled=current===CASES.length-1;notice(state().status==='final'?'本条已提交。':state().status==='draft'?'已恢复草稿。':'');scrollTo({top:0,behavior:'smooth'})}
function renderProgress(){const finals=CASES.filter(c=>states[c.video_id]?.status==='final').length;$('#progress').textContent='已提交 '+finals+' / '+CASES.length;$('#exportJson').disabled=finals!==CASES.length;$('#exportCsv').disabled=finals!==CASES.length;$('#exportNote').textContent=finals===CASES.length?'已完成，可以导出并发回。':'还差 '+(CASES.length-finals)+' 条。';const root=$('#caseList');root.innerHTML='';CASES.forEach((c,i)=>{const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0');b.className=(states[c.video_id]?.status||'')+(i===current?' current':'');b.onclick=()=>show(i);root.appendChild(b)})}
function loadVideo(){video.pause();if(videoUrl){URL.revokeObjectURL(videoUrl);videoUrl=null}const c=CASES[current],name=c.video_id+'.mp4',file=chosenVideos.get(name);$('#videoError').hidden=true;if(file){videoUrl=URL.createObjectURL(file);video.src=videoUrl}else video.src='videos/'+name;video.load();setTimeout(()=>{if(video.readyState<1){$('#videoErrorText').textContent='没读到 '+name+'。请完整解压 ZIP 后再打开，或手动选择 videos 文件夹。';$('#videoError').hidden=false}},3500)}
function renderTicks(){const root=$('#ticks'),d=CASES[current].duration_s;root.innerHTML='';[0,.25,.5,.75,1].forEach(r=>{const x=document.createElement('span');x.textContent=Math.floor(d*r/60)+':'+String(Math.round(d*r)%60).padStart(2,'0');root.appendChild(x)})}
function updateTime(){const d=CASES[current].duration_s,t=Math.max(0,Math.min(d,video.currentTime||0));$('#clock').textContent=t.toFixed(1)+' / '+d.toFixed(1)+' 秒';$('#playhead').style.left=100*t/d+'%'}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportValue(finalOnly=true){const videos=CASES.map(c=>states[c.video_id]).filter(x=>x&&(!finalOnly||x.status==='final'));return{schema_version:'interaction_graph_timeline_offline_export_v1',batch_id:BATCH,manifest_sha256:MANIFEST_HASH,annotator:ANNOTATOR,n_videos:videos.length,videos}}
function csvCell(x){const s=String(x??'');return /[",\r\n]/.test(s)?'"'+s.replaceAll('"','""')+'"':s}
$('#cut').onclick=cut;$('#newEvent').onclick=createEvent;$('#merge').onclick=merge;$('#setStart').onclick=()=>setBoundary('start');$('#setEnd').onclick=()=>setBoundary('end');$('#prevSegment').onclick=()=>choose(selected-1);$('#nextSegment').onclick=()=>choose(selected+1);$('#previous').onclick=()=>show(current-1);$('#next').onclick=()=>show(current+1);
$('#eventSelect').onchange=e=>{state().segments[selected].event_id=e.target.value;touch();render()};$('#eventDescription').oninput=e=>{const ev=eventById(state().segments[selected].event_id);if(ev){ev.description=e.target.value;touch();renderLibrary();renderSegments();renderSelect()}};$('#repeats').onchange=e=>{state().segments[selected].repeats_within_segment=e.target.checked;touch();renderGraph();renderSegments()};$('#segmentNote').oninput=e=>{state().segments[selected].note=e.target.value;touch();renderSegments()};$('#confirmed').onchange=e=>{state().confirmed_full_video=e.target.checked;touch()};$('#draft').onclick=()=>save('draft');$('#submit').onclick=()=>{if(validate()){save('final');if(current<CASES.length-1)setTimeout(()=>show(current+1),250)}};
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>video.playbackRate=+b.dataset.speed);document.addEventListener('pointermove',e=>{if(dragBoundary!==null)moveBoundary(dragBoundary,boundaryTime(e.clientX),true)});document.addEventListener('pointerup',e=>{if(dragBoundary!==null){moveBoundary(dragBoundary,boundaryTime(e.clientX),true);dragBoundary=null;touch()}});video.ontimeupdate=updateTime;video.onloadedmetadata=updateTime;video.onerror=()=>{$('#videoErrorText').textContent='视频无法打开。请确认 ZIP 已完整解压，并用 Chrome 或 Edge 打开。';$('#videoError').hidden=false};
$('#pickFolder').onclick=()=>$('#videoFolder').click();$('#videoFolder').onchange=e=>{chosenVideos=new Map([...e.target.files].filter(f=>f.name.endsWith('.mp4')).map(f=>[f.name,f]));loadVideo();e.target.value=''};
$('#exportJson').onclick=()=>download(ANNOTATOR+'_'+BATCH+'_final.json',JSON.stringify(exportValue(),null,2),'application/json');$('#exportCsv').onclick=()=>{const cols=['video_id','segment_index','start_s','end_s','event_id','event_description','repeats_within_segment','note','annotator','saved_at'],rows=[cols];for(const a of exportValue().videos){const desc=Object.fromEntries(a.events.map(e=>[e.event_id,e.description]));a.segments.forEach((s,i)=>rows.push([a.video_id,i+1,s.start_s,s.end_s,s.event_id,desc[s.event_id]||'',s.repeats_within_segment,s.note||'',ANNOTATOR,a.saved_at]))}download(ANNOTATOR+'_'+BATCH+'_segments.csv',rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')};$('#exportBackup').onclick=()=>download(ANNOTATOR+'_'+BATCH+'_backup.json',JSON.stringify({...exportValue(false),states},null,2),'application/json');$('#importButton').onclick=()=>$('#importBackup').click();$('#importBackup').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(x.manifest_sha256!==MANIFEST_HASH)throw Error('这个备份不属于本批视频。');states=x.states||Object.fromEntries((x.videos||[]).map(v=>[v.video_id,v]));persist();show(current)}catch(error){notice(error.message)}e.target.value=''};
window.onbeforeunload=()=>{if(dirty)save('draft')};show(0);
</script>
</html>
