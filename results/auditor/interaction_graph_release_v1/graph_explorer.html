function visibleNodes(){const q=$('#search').value.trim().toLowerCase(),b=$('#batch').value;return D.nodes.filter(n=>(!b||n.batch_id===b)&&(!q||(n.canonical_description+n.procedure_group_name+n.video_id).toLowerCase().includes(q)))}
