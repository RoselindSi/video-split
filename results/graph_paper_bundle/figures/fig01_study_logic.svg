   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172b3a" transform="translate(657.23112 229.559318)">D: remove oracle dependencies</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #172b3a" transform="translate(657.23112 245.316193)">U1: causal belief query + content nulls</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b3a" transform="translate(657.23112 314.295947)">The direct fix does not close the</text>
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; fill: #172b3a" transform="translate(657.23112 326.613541)">gap.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b3a" x="54.873" y="412.96392" transform="rotate(-0 54.873 412.96392)">Final thesis</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b3a" transform="translate(54.873 437.401695)">Evaluate history content, structural opportunity, and reliable identity separately.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #172b3a" transform="translate(54.873 454.48632)">Recurrence + meaningful branching concern added value beyond a simple successor cache.</text>
   </g>
  </g>
