<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>动作图标注</title>
<style>
:root{color-scheme:dark;--bg:#111513;--panel:#181d1a;--panel2:#202622;--line:#46504a;--text:#f2f4f2;--muted:#aab3ad;--accent:#69c69f;--accent2:#32775b;--warn:#e7b75f;--danger:#e08078}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif;letter-spacing:0}button,select,input,textarea{font:inherit}button,select,input,textarea{color:var(--text);background:#262d29;border:1px solid #68736d;border-radius:4px}button{min-height:44px;padding:8px 12px;cursor:pointer}button:hover{background:#343d38}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button:disabled{opacity:.45;cursor:default}header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;min-height:58px;padding:9px 18px;background:var(--panel);border-bottom:1px solid var(--line)}header a{color:#a9ddc7;text-decoration:none;white-space:nowrap}header h1{font-size:18px;margin:0;min-width:0}#saveState{margin-left:auto;color:var(--muted);white-space:nowrap}main{max-width:1500px;margin:auto;padding:18px}.workspace{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(360px,.75fr);gap:22px;align-items:start}.viewer{position:sticky;top:76px;min-width:0}.viewer video{display:block;width:100%;max-height:66vh;aspect-ratio:4/3;object-fit:contain;background:#000}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px 0}.primary{background:var(--accent2);border-color:var(--accent)}.danger{color:#ffc1bb}.clock{font:15px ui-monospace,monospace;min-width:145px;color:var(--muted)}.speed{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}.speed button{border:0;border-right:1px solid var(--line);border-radius:0;min-width:48px}.speed button:last-child{border-right:0}.speed button.active{background:#41604f}.rail{height:54px;border:1px solid var(--line);background:#222824;position:relative;overflow:hidden}.rail button{position:absolute;top:0;height:100%;border:0;border-right:2px solid #111;border-radius:0;padding:0;min-height:0;color:#111;font-weight:800;overflow:hidden}.rail button.selected{outline:3px solid #fff;outline-offset:-4px}.ticks{display:flex;justify-content:space-between;color:var(--muted);font:12px ui-monospace,monospace;padding-top:4px}.side{border-left:1px solid var(--line);padding-left:22px;min-width:0}.side h2,.segments h2,.graph h2{font-size:18px;margin:0 0 12px}.selectedTitle{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}.selectedTitle strong{font-size:18px}.selectedTitle span{font:14px ui-monospace,monospace;color:var(--muted)}.field{display:grid;gap:6px;margin-bottom:14px}.field label,.fieldLabel{font-weight:700}.field select,.field input,.field textarea{width:100%;padding:10px}.field textarea{min-height:82px;resize:vertical}.eventRow{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;margin-bottom:9px}.swatch{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#111;font-weight:900}.check{display:flex;gap:10px;align-items:flex-start;margin:14px 0}.check input{width:22px;height:22px;flex:none}.notice{min-height:28px;color:#ffc1bb}.section{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}.segments{grid-column:1/-1}.segmentList{display:grid;gap:2px}.segment{display:grid;grid-template-columns:64px 150px 90px minmax(180px,1fr) auto;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #303833;background:transparent}.segment.selected{background:#24342c}.segment button{min-height:38px}.eventBadge{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;color:#111;font-weight:900}.unassigned{color:#ffc1bb}.graph{grid-column:1/-1}.sequence{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:17px}.node{display:inline-grid;place-items:center;min-width:38px;height:38px;border-radius:50%;color:#111;font-weight:900}.arrow{color:var(--muted)}.edgeSummary{color:var(--muted);margin-top:10px}.submitBand{grid-column:1/-1;display:flex;gap:12px;align-items:center;justify-content:flex-end;border-top:1px solid var(--line);padding-top:18px}.submitBand .check{margin:0 auto 0 0}.submitBand button{background:var(--accent2);border-color:var(--accent);min-width:120px}@media(max-width:980px){main{padding:12px}.workspace{grid-template-columns:1fr}.viewer{position:static}.side{border-left:0;border-top:1px solid var(--line);padding:18px 0 0}.segment{grid-template-columns:52px 1fr 70px}.segment .segmentNote{grid-column:1/4}.segment .go{grid-column:3}.submitBand{position:sticky;bottom:0;background:var(--bg);padding:12px 0}}@media(max-width:700px){header{display:grid;grid-template-columns:auto minmax(0,1fr) auto;padding:9px 12px;gap:10px}header h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#pool{display:none}#saveState{margin-left:0;font-size:13px}}
.timelineShell{position:relative;margin-top:10px}.playhead{position:absolute;z-index:8;top:-6px;bottom:-5px;width:2px;background:#fff;box-shadow:0 0 0 1px #111;pointer-events:none;transform:translateX(-1px)}.playhead:before{content:"";position:absolute;top:-1px;left:-5px;width:12px;height:8px;background:#fff;clip-path:polygon(0 0,100% 0,50% 100%)}.rail{touch-action:none}.rail .boundary{z-index:6;width:24px;transform:translateX(-50%);border:0;background:transparent!important;cursor:ew-resize;overflow:visible}.rail .boundary:before{content:"";position:absolute;left:10px;top:5px;bottom:5px;width:4px;border:1px solid #111;background:#fff;box-shadow:0 0 0 1px #fff}.rail .boundary:hover:before,.rail .boundary:focus-visible:before{background:var(--warn)}.boundaryEditor{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}.boundaryEditor button{min-height:48px}.boundaryEditor button:not(:disabled){border-color:#819087}@media(max-width:440px){.boundaryEditor{grid-template-columns:1fr}}
.segmentNavigator{display:grid;grid-template-columns:48px minmax(74px,auto) 48px;gap:8px;align-items:center}.segmentNavigator strong{text-align:center;white-space:nowrap}.segmentNavigator button{width:48px;height:48px;min-height:48px;padding:0;font-size:26px;line-height:1}.selectedTitle>span{white-space:nowrap}@media(max-width:440px){.selectedTitle{align-items:flex-start;flex-direction:column}.selectedTitle>span{align-self:center}}
</style>
<header><a href="/">全部视频</a><h1 id="title"></h1><span id="pool"></span><span id="saveState">载入中</span></header>
<main><div class="workspace">
  <section class="viewer">
    <video id="video" controls preload="metadata"></video>
    <div class="timelineShell">
      <div class="rail" id="rail" aria-label="视频事件时间轴"></div>
      <div class="playhead" id="playhead" aria-hidden="true"></div>
    </div>
    <div class="ticks" id="ticks"></div>
    <div class="toolbar">
      <button id="cut" class="primary">在当前时间切开</button>
      <span class="clock" id="clock">0.0 / 0.0 秒</span>
      <div class="speed"><button data-speed="0.5">0.5x</button><button data-speed="1" class="active">1x</button><button data-speed="2">2x</button></div>
    </div>
  </section>
  <aside class="side">
    <div class="selectedTitle">
      <div class="segmentNavigator">
        <button id="prevSegment" aria-label="选择上一段" title="上一段">←</button>
        <strong id="segmentTitle">第 1 段</strong>
        <button id="nextSegment" aria-label="选择下一段" title="下一段">→</button>
      </div>
      <span id="segmentTime"></span>
    </div>
    <div class="boundaryEditor">
      <button id="setStart">把这段开头改到当前时间</button>
      <button id="setEnd">把这段结尾改到当前时间</button>
    </div>
    <div class="field"><label for="eventSelect">这段是什么事件？</label><select id="eventSelect"></select></div>
    <button id="newEvent">新建事件</button>
    <div class="field section" id="descriptionField"><label for="eventDescription">事件描述</label><textarea id="eventDescription" placeholder="例如：冲洗下水道塞子"></textarea></div>
    <label class="check"><input id="repeats" type="checkbox"><span><strong>这段里同一动作反复发生</strong><br><span style="color:var(--muted)">会记录为这个事件的 self-loop</span></span></label>
    <div class="field"><label for="segmentNote">本段补充（可不填）</label><textarea id="segmentNote"></textarea></div>
    <button id="merge" class="danger">与上一段合并</button>
    <div class="section"><h2>已经创建的事件</h2><div id="eventLibrary"></div></div>
    <div class="notice" id="notice" role="alert"></div>
  </aside>
  <section class="segments section"><h2>全部区间</h2><div class="segmentList" id="segmentList"></div></section>
  <section class="graph section"><h2>当前动作路径</h2><div class="sequence" id="sequence"></div><div class="edgeSummary" id="edgeSummary"></div></section>
  <footer class="submitBand"><label class="check"><input id="confirmed" type="checkbox"><span>我已经从头到尾看完并检查每一段</span></label><button id="submit">提交本条</button></footer>
</div></main>
<script>
const P=__PAYLOAD__, $=s=>document.querySelector(s), video=$('#video');
const colors=['#83c5be','#f3c677','#e69a8d','#9db4e0','#b8a1d9','#90c989','#e6b566','#80b7c9','#d6a3b2','#aebc7b'];
let state=P.initial, selected=0, revision=0, savedRevision=0, timer=null, saving=Promise.resolve(), dragBoundary=null;
video.src='/video/'+encodeURIComponent(P.video_id);$('#title').textContent=P.video_id;$('#pool').textContent=P.source_pool;$('#clock').textContent='0.0 / '+P.duration_s.toFixed(1)+' 秒';
function formatTime(x){x=Math.max(0,Math.round(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')}
function n(x){return Math.round(x*10)/10}
function letterId(value){let s='';while(value){value--;s=String.fromCharCode(65+value%26)+s;value=Math.floor(value/26)}return s}
function nextId(){const used=new Set(state.events.map(e=>e.event_id));for(let value=1;;value++){const id=letterId(value);if(!used.has(id))return id}}
function eventById(id){return state.events.find(e=>e.event_id===id)}
function color(id){const i=state.events.findIndex(e=>e.event_id===id);return colors[(i<0?0:i)%colors.length]}
function payload(){return {video_id:P.video_id,events:state.events,segments:state.segments,confirmed_full_video:$('#confirmed').checked}}
function schedule(){revision++;$('#saveState').textContent='未保存';clearTimeout(timer);timer=setTimeout(save,450)}
async function save(){clearTimeout(timer);saving=saving.then(async()=>{while(savedRevision<revision){const sendingRevision=revision,r=await fetch('/api/draft/'+encodeURIComponent(P.video_id),{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':P.token},body:JSON.stringify(payload())}),d=await r.json();if(!r.ok){$('#saveState').textContent=d.error||'保存失败';return}savedRevision=sendingRevision}$('#saveState').textContent='草稿已保存'});return saving}
function createEvent(){const id=nextId();state.events.push({event_id:id,description:''});state.segments[selected].event_id=id;render();schedule();setTimeout(()=>$('#eventDescription').focus(),0)}
function cut(){const at=n(video.currentTime),i=state.segments.findIndex(s=>at>s.start_s+.1&&at<s.end_s-.1);if(i<0){$('#notice').textContent='请把播放位置放在一个区间的中间。';return}const old=state.segments[i],left={...old,end_s:at},right={start_s:at,end_s:old.end_s,event_id:'',repeats_within_segment:false,note:''};state.segments.splice(i,1,left,right);selected=i+1;$('#notice').textContent='';render();schedule()}
function merge(){if(selected===0)return;const prev=state.segments[selected-1],cur=state.segments[selected];if(cur.event_id&&prev.event_id&&cur.event_id!==prev.event_id&&!confirm('两段的事件不同。合并后保留上一段的事件，继续吗？'))return;prev.end_s=cur.end_s;prev.note=[prev.note,cur.note].filter(Boolean).join('；');prev.repeats_within_segment=prev.repeats_within_segment||cur.repeats_within_segment;state.segments.splice(selected,1);selected--;render();schedule()}
function choose(i,seek=true){selected=Math.max(0,Math.min(i,state.segments.length-1));if(seek)video.currentTime=state.segments[selected].start_s;render()}
function boundaryTime(clientX){const box=$('#rail').getBoundingClientRect(),ratio=Math.max(0,Math.min(1,(clientX-box.left)/box.width));return n(ratio*P.duration_s)}
function moveBoundary(index,time,preview=false){if(index<=0||index>=state.segments.length)return false;const left=state.segments[index-1],right=state.segments[index],low=n(left.start_s+.1),high=n(right.end_s-.1);if(low>high){$('#notice').textContent='这两段太短，不能再移动这个边界。';return false}const at=Math.max(low,Math.min(high,n(time)));left.end_s=at;right.start_s=at;if(preview){video.pause();video.currentTime=at}$('#notice').textContent='边界现在是 '+at.toFixed(1)+' 秒';render();return true}
function setSelectedBoundary(side){const index=side==='start'?selected:selected+1;if(moveBoundary(index,video.currentTime,true))schedule()}
function renderSelect(){const seg=state.segments[selected],sel=$('#eventSelect');sel.innerHTML='<option value="">请选择事件</option>'+state.events.map(e=>'<option value="'+e.event_id+'">事件 '+e.event_id+(e.description?'：'+escapeHtml(e.description):'')+'</option>').join('');sel.value=seg.event_id;const ev=eventById(seg.event_id);$('#eventDescription').value=ev?ev.description:'';$('#eventDescription').disabled=!ev;$('#descriptionField').style.opacity=ev?'1':'.55';$('#repeats').checked=seg.repeats_within_segment;$('#segmentNote').value=seg.note;$('#merge').disabled=selected===0;$('#setStart').disabled=selected===0;$('#setEnd').disabled=selected===state.segments.length-1;$('#prevSegment').disabled=selected===0;$('#nextSegment').disabled=selected===state.segments.length-1;$('#segmentTitle').textContent='第 '+(selected+1)+' / '+state.segments.length+' 段';$('#segmentTime').textContent=seg.start_s.toFixed(1)+' – '+seg.end_s.toFixed(1)+' 秒'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderRail(){const rail=$('#rail');rail.innerHTML='';state.segments.forEach((s,i)=>{const b=document.createElement('button'),width=100*(s.end_s-s.start_s)/P.duration_s;b.style.left=(100*s.start_s/P.duration_s)+'%';b.style.width=width+'%';b.style.background=s.event_id?color(s.event_id):'#6b716d';b.textContent=width>=4?(s.event_id||'?'):'';b.setAttribute('aria-label','第 '+(i+1)+' 段 '+(s.event_id||'未选择'));b.title='第 '+(i+1)+' 段 '+s.start_s.toFixed(1)+'–'+s.end_s.toFixed(1)+' 秒';b.classList.toggle('selected',i===selected);b.onclick=e=>{const box=rail.getBoundingClientRect();video.currentTime=Math.max(s.start_s,Math.min(s.end_s,(e.clientX-box.left)/box.width*P.duration_s));choose(i,false);updateVideoTime()};rail.appendChild(b)});for(let i=1;i<state.segments.length;i++){const h=document.createElement('button'),at=state.segments[i].start_s;h.className='boundary';h.style.left=(100*at/P.duration_s)+'%';h.setAttribute('aria-label','调整 '+at.toFixed(1)+' 秒的边界');h.title='左右拖动调整边界';h.onpointerdown=e=>{e.preventDefault();e.stopPropagation();dragBoundary=i;moveBoundary(i,boundaryTime(e.clientX),true)};h.onclick=e=>e.stopPropagation();h.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();if(moveBoundary(i,at+(e.key==='ArrowLeft'?-.1:.1),true))schedule()}};rail.appendChild(h)}}
function renderTicks(){const root=$('#ticks');root.innerHTML='';[0,.25,.5,.75,1].forEach(r=>{const span=document.createElement('span');span.textContent=formatTime(P.duration_s*r);root.appendChild(span)})}
function updateVideoTime(){const current=Math.max(0,Math.min(P.duration_s,video.currentTime||0));$('#clock').textContent=current.toFixed(1)+' / '+(video.duration||P.duration_s).toFixed(1)+' 秒';$('#playhead').style.left=(100*current/P.duration_s)+'%'}
function renderSegments(){const root=$('#segmentList');root.innerHTML='';state.segments.forEach((s,i)=>{const row=document.createElement('div');row.className='segment'+(i===selected?' selected':'');row.innerHTML='<strong>#'+(i+1)+'</strong><span>'+s.start_s.toFixed(1)+' – '+s.end_s.toFixed(1)+' 秒</span>'+(s.event_id?'<span class="eventBadge" style="background:'+color(s.event_id)+'">'+s.event_id+'</span>':'<span class="unassigned">未选择</span>')+'<span class="segmentNote">'+escapeHtml(s.note||eventById(s.event_id)?.description||'')+'</span><button class="go">查看</button>';row.querySelector('button').onclick=()=>choose(i);root.appendChild(row)})}
function renderLibrary(){const root=$('#eventLibrary');root.innerHTML='';state.events.forEach((e,i)=>{const used=state.segments.filter(s=>s.event_id===e.event_id).length,row=document.createElement('div');row.className='eventRow';row.innerHTML='<span class="swatch" style="background:'+color(e.event_id)+'">'+e.event_id+'</span><span>'+(e.description?escapeHtml(e.description):'<span class="unassigned">还没有描述</span>')+' · '+used+' 段</span><button '+(used?'disabled':'')+'>删除</button>';row.querySelector('button').onclick=()=>{state.events.splice(i,1);render();schedule()};root.appendChild(row)});if(!state.events.length)root.innerHTML='<span style="color:var(--muted)">还没有事件</span>'}
function renderGraph(){const ids=state.segments.map(s=>s.event_id).filter(Boolean),seq=$('#sequence');seq.innerHTML='';ids.forEach((id,i)=>{if(i){const a=document.createElement('span');a.className='arrow';a.textContent='→';seq.appendChild(a)}const x=document.createElement('span');x.className='node';x.style.background=color(id);x.textContent=id;seq.appendChild(x)});if(!ids.length)seq.innerHTML='<span style="color:var(--muted)">选择事件后会显示路径</span>';const edges={};state.segments.forEach(s=>{if(s.event_id&&s.repeats_within_segment){const k=s.event_id+'→'+s.event_id;edges[k]=(edges[k]||0)+1}});for(let i=1;i<ids.length;i++){const k=ids[i-1]+'→'+ids[i];edges[k]=(edges[k]||0)+1}$('#edgeSummary').textContent=Object.entries(edges).map(([k,v])=>k+' ×'+v).join('，')}
function render(){selected=Math.min(selected,state.segments.length-1);renderSelect();renderRail();renderSegments();renderLibrary();renderGraph()}
$('#cut').onclick=cut;$('#newEvent').onclick=createEvent;$('#merge').onclick=merge;$('#setStart').onclick=()=>setSelectedBoundary('start');$('#setEnd').onclick=()=>setSelectedBoundary('end');$('#prevSegment').onclick=()=>choose(selected-1);$('#nextSegment').onclick=()=>choose(selected+1);
$('#eventSelect').onchange=e=>{state.segments[selected].event_id=e.target.value;render();schedule()};
$('#eventDescription').oninput=e=>{const ev=eventById(state.segments[selected].event_id);if(ev){ev.description=e.target.value;renderLibrary();renderSegments();schedule()}};
$('#repeats').onchange=e=>{state.segments[selected].repeats_within_segment=e.target.checked;renderGraph();schedule()};
$('#segmentNote').oninput=e=>{state.segments[selected].note=e.target.value;renderSegments();schedule()};
$('#confirmed').checked=!!state.confirmed_full_video;$('#confirmed').onchange=schedule;
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{video.playbackRate=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('active',x===b))});
document.addEventListener('pointermove',e=>{if(dragBoundary!==null){e.preventDefault();moveBoundary(dragBoundary,boundaryTime(e.clientX),true)}});
document.addEventListener('pointerup',e=>{if(dragBoundary!==null){moveBoundary(dragBoundary,boundaryTime(e.clientX),true);dragBoundary=null;schedule()}});
video.ontimeupdate=updateVideoTime;video.onloadedmetadata=updateVideoTime;video.onseeked=updateVideoTime;
$('#submit').onclick=async()=>{await save();const r=await fetch('/api/final/'+encodeURIComponent(P.video_id),{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':P.token},body:JSON.stringify(payload())});const d=await r.json();$('#notice').textContent=r.ok?'':(d.error||'提交失败');$('#saveState').textContent=r.ok?'本条已提交':'请检查';if(r.ok)state.graph=d.graph};
renderTicks();render();updateVideoTime();$('#saveState').textContent=P.initial.status==='final'?'已载入最终版本':'已载入';
</script>
</html>
