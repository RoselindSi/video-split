  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526777" x="40.32" y="53.498437" transform="rotate(-0 40.32 53.498437)">E1b qualitative synthesis (left); E2 measured contrasts, n=307 decisions / 49 videos (right).</text>
